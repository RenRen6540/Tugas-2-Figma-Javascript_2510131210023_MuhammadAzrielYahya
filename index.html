<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1>
  <title>Tantamount! Fauna Nusantara</title>
  <link rel="stylesheet" href="style.css>
</head>
<body>
  <header>
    <h1>Tantamount!</h1>
    <nav>
      <button>Menu</button>
      <button>Papan skor</button>
    </nav>
  </header>

  <main>
    <!-- Membuat layar 1 yaitu Menu -->
    <section>
      <article>
        <h2>Samakan pasangan hewan Nusantara</h2>
        <p>Balik dua kartu, samakan hewannya, dan pelajari fakta setiap hewan.</p>
        <label for="input-nama">Nama pemain</label>
        <input id="input-nama" type="text" maxlenght="14" placeholder="Contoh: Yahya" autocomplete="off">
        <fieldset>
          <legend>Pilih tingkat</legend>
        </fieldset>
        <button id="btn-mulai">Mulai main!</button>
      </article>
      <article>
        <h2>Skor tertinggi</h2>
      </article>
    </section>

    <!-- Membuat layar 2 yaitu tampilan game -->
    <section>
      <h2>Papan permainan</h2>
      <div><span>Waktu</span></div>
      <div><span>Langkah</span></div>
      <div><span>Skor</span></div>
      <div><span>Kombo</span></div>
      <button>Intip kartu(2)</button>
      <button>Jeda</button>
      <button>Ulang</button>
    </section>

    <!-- Membuat layar 3 yaitu tampilan setelah selesai bermain atau hasil -->
    <section>
      <article>
        <h3>Hewan yang kamu temukan</h3>
        <ul id="daftar-temuan"></ul>
        <div>
          <button id="btn-main-lagi">Main lagi</button>
          <button id="btn-ke-menu">Ke menu</button>
        </div>
      </article>
    </section>
  </main>
</body>
